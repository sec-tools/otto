[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "otto"
version = "1.0.0"
description = "Otto — an experimental, read-only, always-on AI briefing assistant for macOS"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
keywords = ["macos", "briefing", "slack", "menubar", "assistant", "read-only"]
classifiers = [
    "Environment :: MacOS X",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business",
]
# Runtime footprint is deliberately tiny: everything else (osascript,
# launchd, screencapture, Keychain) ships with macOS.
dependencies = [
    "httpx>=0.24",
    "aiosqlite>=0.19",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
otto = "otto.cli:main"

[project.optional-dependencies]
# Nice-to-haves that Otto detects at runtime and degrades gracefully without.
extras = [
    "langdetect",   # language detection for non-English content
    "keyring",      # legacy Keychain credential helpers
    "psutil",       # memory-pressure monitoring in the supervisor
]
dev = [
    "pytest>=7",
    "pytest-asyncio>=0.21",
    "pytest-cov",
    "ruff",
]

[tool.hatch.build.targets.wheel]
packages = ["src/otto"]

[tool.ruff]
line-length = 120
target-version = "py39"
src = ["src", "tests"]
extend-exclude = ["bin"]

[tool.ruff.lint]
# Correctness only: undefined names, unused imports/variables, syntax-level
# errors. Style is left to the reader.
select = ["F", "E9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
filterwarnings = ["ignore::DeprecationWarning"]
